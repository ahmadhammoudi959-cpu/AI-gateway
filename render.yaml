# Render Blueprint: Dashboard → New → Blueprint → choose this repository.
# Creates the web service in Frankfurt (closest Render region to Egypt/Levant). The database is external (DATABASE_URL).
services:
  - type: web
    name: ai-gateway
    runtime: node
    region: frankfurt
    # Free plan: sleeps after 15 idle minutes and the next request waits ~1 minute to wake it up.
    # For production switch to a paid instance, e.g. 0.5c-512mb.
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Postgres connection string. Free option: a Neon project (neon.com) — copy its connection string here.
      # (Render allows only one free Postgres per workspace, and it expires after 30 days.)
      - key: DATABASE_URL
        sync: false
      # Encrypts the providers' API keys in the database. Keep a copy: if it changes,
      # the saved provider keys must be entered again.
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      # First admin account — Render asks for these when the Blueprint is created.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_TIMEZONE
        value: Africa/Cairo

